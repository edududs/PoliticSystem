version: '3.9'

services:
  db:
    image: postgres:15
    restart: always
    volumes:
      - ./data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: edududs
      POSTGRES_USER: edududs_user
      POSTGRES_PASSWORD: edududs_pass
    ports:
      - "5432:5432"

  web:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: >
      sh -c "
        python manage.py collectstatic &&
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./core:/edududs/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "1"
      DJANGO_SETTINGS_MODULE: core.settings
      POSTGRES_DB: edududs
      POSTGRES_USER: edududs_user
      POSTGRES_PASSWORD: edududs_pass
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      - db
